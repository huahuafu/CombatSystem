spring.application.name=CombatSystem
spring.application.name=CombatAI-Mongo
spring.data.mongodb.uri=mongodb://localhost:27017/bigdb

# 百度地图API配置
# 请到 https://lbsyun.baidu.com/apiconsole/key 申请API Key
# 注意：应用类型必须选择"浏览器端"，并配置正确的白名单
baidu.map.api.key=G6IRHSliTBVOFdenO9MBHG8bH9A3PDXn

# 地形自动识别（离线栅格数据）
# ESA WorldCover GeoTIFF 文件路径（示例：D:/gis/worldcover/ESA_WorldCover_10m_2021_v200.tif）
terrain.worldcover.geotiff.path=

# 通义千问 / DashScope 大模型配置（通过 Spring AI OpenAI 兼容模式调用）
spring.ai.openai.base-url=https://dashscope.aliyuncs.com/compatible-mode
spring.ai.openai.api-key=sk-3c7216d92088405486429a69bd61b810
spring.ai.openai.chat.options.model=qwen-plus

# FastAPI AI strategy service
combat.ai.fastapi.enabled=false
combat.ai.fastapi.base-url=http://localhost:8001
combat.cutover.default-route=next

# 战后简报：启用则调用 spring.ai.openai 兼容接口生成叙事（与上方 DashScope 配置共用）
combat.debrief.llm.enabled=false